<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#a41f22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tareas Brandsen">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Tareas Kiosco Brandsen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Archivo:wght@400;500;600;700&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: banda roja de marca arriba, una columna angosta tipo planilla, filas grandes para tildar con el dedo */
:root{
  --bg:#f8f5f0; --surface:#ffffff; --ink:#1f1515; --muted:#6e5c58; --line:#e8ddd5;
  --red:#a41f22; --band:#a41f22; --on-band:#ffffff; --yellow:#e2c21f; --yellow-soft:#f6e9a6; --on-yellow:#2a1d00;
  --ok:#2c7a47; --ok-soft:#e1f1e6; --warn:#a8510c; --warn-soft:#fbeadb;
  --f-display:"Archivo Black","Arial Black",Impact,sans-serif;
  --f-label:"Anton","Impact","Arial Narrow",sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171010; --surface:#231818; --ink:#f5ece8; --muted:#b9a5a0; --line:#3a2927;
  --red:#e2524d; --band:#8e1a1d; --on-band:#ffffff; --yellow:#f0d34a; --yellow-soft:#4a3d0c; --on-yellow:#2a1d00;
  --ok:#5cc282; --ok-soft:#173222; --warn:#f0954a; --warn-soft:#3b2414; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171010; --surface:#231818; --ink:#f5ece8; --muted:#b9a5a0; --line:#3a2927;
  --red:#e2524d; --band:#8e1a1d; --on-band:#ffffff; --yellow:#f0d34a; --yellow-soft:#4a3d0c; --on-yellow:#2a1d00;
  --ok:#5cc282; --ok-soft:#173222; --warn:#f0954a; --warn-soft:#3b2414; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}

.band{background:#a41f22;color:#fff}
.logo{display:block;height:68px;width:auto;max-width:60vw}
@media (min-width:600px){.logo{height:84px}}
.band .in{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1}
.brand .k{font-family:var(--f-display);color:var(--yellow);font-size:15px;letter-spacing:.04em}
.brand .b{font-family:var(--f-display);font-size:26px;letter-spacing:.01em}
.band .date{font-family:var(--f-label);font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--yellow)}

main{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:flex;flex-direction:column;gap:22px}

h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--f-display);font-size:26px;line-height:1.1}
h2{font-family:var(--f-label);font-weight:400;font-size:17px;letter-spacing:.07em;text-transform:uppercase;color:var(--red)}
.muted{color:var(--muted)}
.small{font-size:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-label);font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:var(--yellow-soft);color:var(--ink);white-space:nowrap}
.chip.f-noche{background:var(--band);color:var(--on-band)}
.chip.f-soporte{background:var(--yellow);color:var(--on-yellow)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}

/* tarjetas de turno */
.turnos{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.tcard{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.tcard:hover{border-color:var(--red)}
.tcard .who{font-family:var(--f-display);font-size:22px;line-height:1}
.tcard .hrs{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.tcard .state{font-size:13px;color:var(--muted)}

/* selector de días */
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.daychip{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--f-label);font-size:16px;letter-spacing:.05em;text-transform:uppercase;min-width:0}
.daychip i{font-style:normal;font-family:var(--f-body);font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--red)}
.daychip.on{background:var(--red);border-color:var(--red);color:#fff}
.daychip.on i{color:var(--yellow)}
/* reglas soporte */
.rule{background:var(--band);color:var(--on-band);border-radius:10px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.rule svg{flex:none;margin-top:2px}
.rule strong{font-family:var(--f-display);display:block;font-size:17px;color:var(--yellow);letter-spacing:.01em}
.rule p{margin:4px 0 0;font-size:15px}

/* progreso */
.prog{display:flex;align-items:center;gap:12px}
.bar{flex:1;height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:6px;transition:width .25s}
.prog b{font-family:var(--f-label);font-weight:400;font-size:20px;font-variant-numeric:tabular-nums;letter-spacing:.03em}

/* bloques y tareas */
.block{display:flex;flex-direction:column;gap:0}
.block h2{padding:0 2px 8px;border-bottom:2px solid var(--red)}
.task{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line);align-items:start}
.cb{width:40px;height:40px;border-radius:8px;border:2px solid var(--muted);background:var(--surface);display:grid;place-items:center;padding:0}
.cb svg{opacity:0}
.task.done .cb{background:var(--ok);border-color:var(--ok)}
.task.done .cb svg{opacity:1}
.task .txt{min-width:0;display:flex;flex-direction:column;gap:6px;padding-top:8px}
.task.done .tt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--muted)}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.hora{font-size:12.5px;color:var(--ok);font-variant-numeric:tabular-nums;font-weight:600}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px;font-weight:600}
.field input[type=text],.field select,textarea,input.inp,select.inp{width:100%;min-width:0;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:9px 10px}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{border:1px solid var(--line);background:var(--bg);border-radius:20px;padding:6px 12px;font-size:14px}
.opt.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--muted)}

/* botones */
.btn{border:0;border-radius:8px;padding:12px 18px;font-weight:700;background:var(--surface);border:1px solid var(--line)}
.btn.primary{background:var(--red);color:#fff;border-color:var(--red)}
.btn.yellow{background:var(--yellow);color:var(--on-yellow);border-color:var(--yellow)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:8px 4px}
.btn.big{width:100%;padding:16px;font-family:var(--f-display);font-size:17px;letter-spacing:.02em}
.btn:disabled{opacity:.5;cursor:default}
.back{align-self:flex-start;display:inline-flex;align-items:center;gap:6px}

/* cierre */
.pend{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.pend .tt{font-weight:600}
.err{color:var(--warn);font-size:14px;font-weight:600}

.summary{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;white-space:pre-wrap;font-size:15px;overflow-wrap:anywhere}

/* admin */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;padding:10px 12px;font-family:var(--f-label);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:var(--red);border-bottom-color:var(--red)}
.adm-task{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.adm-task .tt{min-width:0}
.icons{display:flex;gap:4px}
.ib{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.ib.danger{color:var(--warn)}
.confirm{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:14px}
.form{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.form .two{grid-template-columns:1fr}}
.check{display:flex;gap:8px;align-items:center}
.check input{width:20px;height:20px}
.hist{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;text-align:left;width:100%}
.hist .top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.hist .det{border-top:1px solid var(--line);padding-top:8px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.motbar{display:grid;grid-template-columns:minmax(0,1fr) 120px 28px;gap:10px;align-items:center;font-size:14px}
.motbar .b{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.motbar .b i{display:block;height:100%;background:var(--warn)}
.motbar span:last-child{font-variant-numeric:tabular-nums;text-align:right}
.code{font-family:var(--f-label);font-size:28px;letter-spacing:.3em;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.note{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:14px;font-weight:600}
footer{display:flex;justify-content:center}
.chip.must{background:var(--red);color:#fff}
.task.oblig .cb{border-color:var(--red)}
.pend.oblig{border-left-color:var(--red)}
.ib.mustb{background:var(--red);color:#fff;border-color:var(--red)}
.ib{font-family:var(--f-display)}
.reset{display:flex;justify-content:center;padding-top:6px}
.linkbtn.muted2{color:var(--muted)}
h2.red{color:var(--red)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi b{font-family:var(--f-display);font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.kpi span{font-weight:600;font-size:14px}
.kpi small{color:var(--muted);font-size:12px}
.kpi.bad b{color:var(--red)}
.hb{display:grid;grid-template-columns:minmax(0,9rem) minmax(0,1fr) 5.5rem;gap:10px;align-items:center;font-size:14px}
.hb .hl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ht{height:12px;background:var(--line);border-radius:6px;overflow:hidden}
.ht i,.vt i{display:block;height:100%;background:var(--ok);border-radius:6px}
.ht i.low,.vt i.low{background:var(--red)}
.ht i.warnb{background:var(--warn)}
.hv{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.hv small{color:var(--muted);font-weight:500}
.vbars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;height:170px}
.vb{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%}
.vt{flex:1;width:70%;background:var(--line);border-radius:6px;display:flex;align-items:flex-end;overflow:hidden}
.vt i{width:100%;border-radius:6px 6px 0 0}
.vv{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;min-height:1em}
.vl{font-size:12px;color:var(--muted);white-space:nowrap}
.tbl{overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
.tbl th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.tbl td.bad{color:var(--red);font-weight:700}
.lst{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.report{display:flex;flex-direction:column;gap:22px}
@media print{
  .noprint,.toast,footer{display:none!important}
  body{background:#fff;color:#000}
  main{padding-block:10px}
  .kpi,.tbl,section{break-inside:avoid}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.quien{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.quien .ql{font-weight:700;font-size:14px}
.linkbtn{align-self:flex-start;background:none;border:0;padding:2px 0;color:var(--warn);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.nohice{background:var(--warn-soft);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.nohice select,.nohice input{background:var(--surface)}
.endbar{position:sticky;bottom:0;z-index:5;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) -48px;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.endbar .endin{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px max(16px,env(safe-area-inset-left,0px))}
.endbar b{font-family:var(--f-label);font-weight:400;font-size:20px;font-variant-numeric:tabular-nums}
.btn.wa{background:#1f9d55;border-color:#1f9d55;color:#fff;text-align:center;text-decoration:none;display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<header class="band"><div class="in">
  <img class="logo" src="logo.png" alt="Kiosco Brandsen" width="480" height="284">
  <div class="date" id="hdate"></div>
</div></header>
<main id="app"><div class="empty">Cargando turnos…</div></main>
<div class="toast" id="toast" hidden></div>

<script>
const DIAS=["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
const DIAS_C=["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
const FORMATOS={turno8:"Turno 8 hs",noche:"Soporte noche",soporte:"Soporte tareas"};
const EQUIPO=["Kary","Ivo","Gabi","Lucas","Ari","Tizi","Juli","Mica"];
const COMP="Lo hizo uno de mis compañeros";
const faltaMotivo=it=>!it?.motivo||(it.motivo===COMP&&!(it.comentario||"").trim());
const campoComent=(x,it)=>it.motivo===COMP
  ?`<label for="c_${x.id}">¿Quién la hizo? (obligatorio)</label><input type="text" id="c_${x.id}" data-coment="${x.id}" value="${esc(it.comentario||"")}" placeholder="Nombre del compañero">`
  :`<label for="c_${x.id}">Comentario (opcional)</label><input type="text" id="c_${x.id}" data-coment="${x.id}" value="${esc(it.comentario||"")}">`;
const MOTIVOS=["Mucha gente / no hubo tiempo","Faltó mercadería o insumo","No sabía cómo hacerla","La dejé para el próximo turno (avisado)","Lo hizo uno de mis compañeros","Me olvidé","Otro"];
const ICON_CHECK='<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const ICON_CAM='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h3l2-3h8l2 3h3v11H3z"/><circle cx="12" cy="13" r="3.5"/></svg>';
const ICON_PHONE='<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M3 3l18 18"/></svg>';
const ICON_BACK='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>';
const ICON_UP='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 15l6-6 6 6"/></svg>';
const ICON_DOWN='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>';
const ICON_DEL='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>';

const SB_URL="https://gkdlbldafyzpminpykvg.supabase.co";
const SB_KEY="sb_publishable_B2xWIiuHxtj6uMQbjiWMog_Jkt0NNE4";
async function api(path,{method="GET",body,prefer}={}){
  const headers={apikey:SB_KEY,"Content-Type":"application/json"};if(prefer)headers.Prefer=prefer;
  const r=await fetch(`${SB_URL}/rest/v1/${path}`,{method,headers,body:body===undefined?undefined:JSON.stringify(body)});
  const txt=await r.text();let data=null;try{data=txt?JSON.parse(txt):null}catch(_){}
  if(!r.ok){const e=new Error(data?.message||("HTTP "+r.status));e.status=r.status;e.msg=data?.message||"";throw e}
  return data;
}
const rpc=(fn,args)=>api("rpc/"+fn,{method:"POST",body:args});
const S={db:true,code:"",motOpen:new Set(),turnos:[],loaded:false,loadNote:"",view:"home",turnoId:null,reg:null,readonly:false,
  cierreErr:false,admin:false,aTab:"tareas",aTurno:null,aConfirm:null,aBloqueNuevo:false,aCampo:"ninguno",hist:null,histOpen:null,loginErr:"",busy:false};

const $app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const clone=o=>JSON.parse(JSON.stringify(o));
const uid=()=>"t"+Math.random().toString(36).slice(2,9);

/* Día operativo: hasta las 3 AM cuenta como el día anterior (turnos que cierran a la 1) */
function diaOp(offset=0){const d=new Date();if(d.getHours()<3)d.setDate(d.getDate()-1);d.setDate(d.getDate()+offset);return d}
const fechaKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fechaCorta=d=>`${DIAS_C[d.getDay()].toLowerCase()} ${d.getDate()}/${d.getMonth()+1}`;
const horaAhora=()=>{const d=new Date();return pad(d.getHours())+":"+pad(d.getMinutes())};

function toast(m){const t=document.getElementById("toast");t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600)}

const turno=id=>S.turnos.find(t=>t.id===id);
const turnosDelDia=dia=>S.turnos.filter(t=>t.dia===dia).sort((a,b)=>(a.inicio||0)-(b.inicio||0));
function bloquesDe(t){const order=[...(t.bloques||[])];(t.tareas||[]).forEach(x=>{if(!order.includes(x.bloque))order.push(x.bloque)});return order.filter(b=>(t.tareas||[]).some(x=>x.bloque===b))}

/* ---------- registro del turno (borrador que se guarda solo) ---------- */
let writing=false,dirty=false,saveT=null;
function saveReg(){if(!S.reg||S.readonly)return;dirty=true;clearTimeout(saveT);saveT=setTimeout(flush,450)}
function flushSnapshot(){const t=turno(S.reg.turnoId);
  if(t){S.reg.tareasSnapshot=(t.tareas||[]).map(x=>({id:x.id,texto:x.texto,bloque:x.bloque,campo:x.campo?.label||"",foto:!!x.foto,obligatoria:!!x.obligatoria}));
    S.reg.total=(t.tareas||[]).length;S.reg.hechas=(t.tareas||[]).filter(x=>S.reg.items[x.id]?.hecho).length}}
async function flush(){
  if(writing||!dirty||!S.db||!S.reg)return;writing=true;dirty=false;
  const t=turno(S.reg.turnoId);
  if(t){S.reg.tareasSnapshot=(t.tareas||[]).map(x=>({id:x.id,texto:x.texto,bloque:x.bloque,campo:x.campo?.label||"",foto:!!x.foto,obligatoria:!!x.obligatoria}));
    S.reg.total=(t.tareas||[]).length;S.reg.hechas=(t.tareas||[]).filter(x=>S.reg.items[x.id]?.hecho).length}
  S.reg.actualizado=new Date().toISOString();
  try{await api("registros?on_conflict=id",{method:"POST",prefer:"resolution=merge-duplicates,return=minimal",body:{id:S.reg.id,fecha:S.reg.fecha,turno_id:S.reg.turnoId,data:clone(S.reg),actualizado:S.reg.actualizado}})}
  catch(e){toast("No se pudo guardar. Revisá la conexión a internet.");dirty=true}
  writing=false;if(dirty)saveT=setTimeout(flush,1500);
}
function item(id){if(!S.reg.items[id])S.reg.items[id]={hecho:false,hora:"",motivo:"",comentario:"",dato:""};return S.reg.items[id]}

async function abrirTurno(id,readonly){

  const d=diaOp(0);const key=fechaKey(d)+"_"+id;
  S.reg={id:key,fecha:fechaKey(d),fechaTxt:fechaCorta(d),turnoId:id,turnoNombre:t.nombre,persona:t.persona,formato:t.formato,items:{},cerrado:false,cerradoHora:""};
  S.regExiste=false;S.view="lista";render();window.scrollTo(0,0);

/* ---------- resumen para WhatsApp ---------- */
function resumenTexto(){
  const t=turno(S.reg.turnoId);const tareas=t?.tareas||[];
  const hechas=tareas.filter(x=>S.reg.items[x.id]?.hecho);
  const no=tareas.filter(x=>!S.reg.items[x.id]?.hecho);
  const otroDia=t.dia!==diaOp(0).getDay()?` (lista del ${DIAS[t.dia].toLowerCase()})`:"";
  const quien=S.reg.persona||t.persona;const reemp=quien!==t.persona?` (reemplaza a ${t.persona})`:"";
  let s=`✅ *${t.nombre} – ${quien}*${reemp} · ${S.reg.fechaTxt}${otroDia}\n${FORMATOS[t.formato]} · ${t.horario}\nHechas: ${hechas.length}/${tareas.length}`;
  if(S.reg.cerradoHora)s+=` · Cerrado ${S.reg.cerradoHora}`;
  const oblNo=no.filter(x=>x.obligatoria);
  if(oblNo.length){s+=`\n\n⚠️ *OBLIGATORIAS SIN HACER*`;oblNo.forEach(x=>{const it=S.reg.items[x.id]||{};s+=`\n• ${x.texto} → ${it.motivo||"sin motivo"}${it.comentario?` (${it.comentario})`:""}`})}
  if(hechas.length){s+=`\n\n✔️ *Hechas*`;hechas.forEach(x=>{const it=S.reg.items[x.id]||{};s+=`\n• ${x.texto}${it.hora?` (${it.hora})`:""}`})}
  const noRest=no.filter(x=>!x.obligatoria);
  if(noRest.length){s+=`\n\n❌ *No hechas*`;noRest.forEach(x=>{const it=S.reg.items[x.id]||{};s+=`\n• ${x.texto} → ${it.motivo||"sin motivo"}${it.comentario?` (${it.comentario})`:""}`})}
  const datos=tareas.filter(x=>x.campo&&S.reg.items[x.id]?.dato);
  if(datos.length){s+=`\n\n📋 *Avisos*`;datos.forEach(x=>{s+=`\n• ${x.campo.label}: ${S.reg.items[x.id].dato}`})}
  const fotos=hechas.filter(x=>x.foto);
  if(fotos.length){s+=`\n\n📸 *Mandar foto de:* ${fotos.map(x=>x.fotoNombre||x.texto.split(/[:(,]/)[0].trim().toLowerCase()).join(", ")}`}
  return s;
}

/* ---------- archivar y vaciar (el historial nunca pierde nada) ---------- */
const tieneContenido=d=>!!d&&(d.cerrado||Object.values(d.items||{}).some(i=>i.hecho||i.motivo||i.dato));
async function archivarYVaciar(id,turnoId,fecha,data,quien){
  if(tieneContenido(data)){
    const arch={...clone(data),archivada:true,archivadaHora:horaAhora(),archivadaPor:quien};
    await api("registros",{method:"POST",prefer:"return=minimal",body:{id:id+"~"+Date.now(),fecha,turno_id:turnoId,data:arch,actualizado:new Date().toISOString()}});
  }
  const limpio={...clone(data),items:{},cerrado:false,cerradoHora:"",hechas:0,actualizado:new Date().toISOString()};
  await api("registros?on_conflict=id",{method:"POST",prefer:"resolution=merge-duplicates,return=minimal",body:{id,fecha,turno_id:turnoId,data:limpio,actualizado:limpio.actualizado}});
  return limpio;
}

/* ---------- tildes muy seguidos ---------- */
function tildesRapidos(r){
  const ms=Object.values(r.items||{}).filter(i=>i.hecho&&i.hora).map(i=>{const [h,m]=i.hora.split(":").map(Number);return h*60+m}).sort((a,b)=>a-b);
  let max=0;for(let i=0,j=0;i<ms.length;i++){while(ms[i]-ms[j]>3)j++;max=Math.max(max,i-j+1)}
  return max>=8?max:0;
}

/* ---------- estadísticas de un registro ---------- */
function statsReg(r){
  const cur=turno(r.turnoId)?.tareas||[];const snap=(r.tareasSnapshot||[]).map(x=>x.obligatoria===undefined?{...x,obligatoria:!!cur.find(c=>c.id===x.id)?.obligatoria}:x);const it=r.items||{};
  const hechas=snap.filter(x=>it[x.id]?.hecho);const no=snap.filter(x=>!it[x.id]?.hecho);
  return {snap,hechas,no,oblNo:no.filter(x=>x.obligatoria),total:snap.length};
}

/* ---------- resumen semanal ---------- */
function rangoSemana(off){
  const d=diaOp(0);const dow=(d.getDay()+6)%7;const lun=new Date(d);lun.setDate(d.getDate()-dow+off*7);lun.setHours(12,0,0,0);
  const dom=new Date(lun);dom.setDate(lun.getDate()+6);return {lun,dom};
}
async function cargarSemana(){
  S.sem=null;render();
  const {lun,dom}=rangoSemana(S.semOff||0);
  try{const rows=await api(`registros?select=id,data&fecha=gte.${fechaKey(lun)}&fecha=lte.${fechaKey(dom)}&order=fecha.asc&limit=1000`);
    S.sem=rows.map(r=>({...r.data,id:r.id})).filter(r=>!r.archivada&&tieneContenido(r))}
  catch(e){S.sem=[];toast("No se pudo cargar la semana.")}
  if(S.view==="admin"&&S.aTab==="semanal")render();
}
function calcSemana(){
  const regs=S.sem||[];const {lun,dom}=rangoSemana(S.semOff||0);const hoy=diaOp(0);
  const P={},D={},M={},T={},oblNo=[],rapidos=[],prov=[];let tot=0,hech=0;
  for(let i=0;i<7;i++){const d=new Date(lun);d.setDate(lun.getDate()+i);D[fechaKey(d)]={label:DIAS_C[d.getDay()]+" "+d.getDate(),tot:0,hech:0}}
  regs.forEach(r=>{const s=statsReg(r);const q=r.persona||"—";
    tot+=s.total;hech+=s.hechas.length;
    P[q]=P[q]||{turnos:0,tot:0,hech:0,obl:0,cerr:0};P[q].turnos++;P[q].tot+=s.total;P[q].hech+=s.hechas.length;P[q].obl+=s.oblNo.length;if(r.cerrado)P[q].cerr++;
    if(D[r.fecha]){D[r.fecha].tot+=s.total;D[r.fecha].hech+=s.hechas.length}
    s.no.forEach(x=>{const i=r.items?.[x.id]||{};if(i.motivo)M[i.motivo]=(M[i.motivo]||0)+1;T[x.texto]=(T[x.texto]||0)+1});
    s.oblNo.forEach(x=>{const i=r.items?.[x.id]||{};oblNo.push({fecha:r.fechaTxt||r.fecha,quien:q,texto:x.texto,motivo:i.motivo||"sin motivo",com:i.comentario||""})});
    const rp=tildesRapidos(r);if(rp)rapidos.push({fecha:r.fechaTxt||r.fecha,quien:q,turno:r.turnoNombre,n:rp});
    s.snap.filter(x=>x.campo&&/proveedor/i.test(x.campo)&&r.items?.[x.id]?.dato).forEach(x=>prov.push({fecha:r.fechaTxt||r.fecha,quien:q,dato:r.items[x.id].dato}));
  });
  const hechosIds=new Set(regs.map(r=>r.turnoId));const faltan=[];
  S.turnos.filter(t=>(t.tareas||[]).length).forEach(t=>{const d=new Date(lun);d.setDate(lun.getDate()+((t.dia+6)%7));
    if(fechaKey(d)<=fechaKey(hoy)&&!hechosIds.has(t.id))faltan.push({t,d})});
  faltan.sort((a,b)=>a.d-b.d);
  return {lun,dom,regs,P,D,M,T,oblNo,rapidos,prov,faltan,tot,hech,pct:tot?Math.round(hech/tot*100):0};
}
const pctTxt=(h,t)=>t?Math.round(h/t*100)+"%":"—";
function barra(label,val,max,txt,cls=""){return `<div class="hb"><span class="hl">${esc(label)}</span><span class="ht"><i class="${cls}" style="width:${max?Math.max(2,val/max*100):0}%"></i></span><span class="hv">${txt}</span></div>`}
function vSemanal(){
  if(!S.sem)return `<div class="empty">Cargando la semana…</div>`;
  const c=calcSemana();const f=d=>`${d.getDate()}/${d.getMonth()+1}`;
  const nav=`<div class="row noprint" style="justify-content:space-between">
    <div class="row"><button class="ib" data-act="semPrev" aria-label="Semana anterior">${ICON_BACK}</button>
    <button class="ib" data-act="semNext" aria-label="Semana siguiente" ${(S.semOff||0)>=0?"disabled":""} style="transform:scaleX(-1)">${ICON_BACK}</button></div>
    <div class="row"><button class="btn yellow" data-act="semCopiar">Copiar para WhatsApp</button><button class="btn primary" data-act="semPdf">Descargar PDF</button></div></div>`;
  const head=`<section class="stack"><h2>Resumen semanal</h2><h1 style="font-size:22px">Semana del ${f(c.lun)} al ${f(c.dom)}</h1></section>`;
  if(!c.regs.length&&!c.faltan.length)return nav+head+`<div class="empty">No hay turnos registrados esta semana.</div>`;
  const kpi=`<div class="kpis">
    <div class="kpi"><b>${c.pct}%</b><span>tareas hechas</span><small>${c.hech} de ${c.tot}</small></div>
    <div class="kpi"><b>${c.regs.length}</b><span>turnos registrados</span><small>${c.regs.filter(r=>r.cerrado).length} cerrados</small></div>
    <div class="kpi ${c.oblNo.length?"bad":""}"><b>${c.oblNo.length}</b><span>obligatorias sin hacer</span><small>facturar, fotos, proveedores</small></div>
    <div class="kpi ${c.faltan.length?"bad":""}"><b>${c.faltan.length}</b><span>turnos sin usar la app</span><small>no hay registro</small></div></div>`;
  const pers=Object.entries(c.P).sort((a,b)=>b[1].hech/b[1].tot-a[1].hech/a[1].tot);
  const porPersona=`<section class="stack"><h2>Cumplimiento por persona</h2>${pers.map(([q,p])=>barra(q,p.hech,p.tot,`${pctTxt(p.hech,p.tot)} <small>${p.hech}/${p.tot}</small>`,p.hech/p.tot<.7?"low":"")).join("")}
    <div class="tbl"><table><thead><tr><th>Persona</th><th>Turnos</th><th>Cerrados</th><th>Hechas</th><th>Obligatorias sin hacer</th></tr></thead><tbody>
    ${pers.map(([q,p])=>`<tr><td>${esc(q)}</td><td>${p.turnos}</td><td>${p.cerr}</td><td>${p.hech}/${p.tot} (${pctTxt(p.hech,p.tot)})</td><td class="${p.obl?"bad":""}">${p.obl}</td></tr>`).join("")}</tbody></table></div></section>`;
  const dias=Object.values(c.D);
  const porDia=`<section class="stack"><h2>Cumplimiento por día</h2><div class="vbars">${dias.map(d=>`<div class="vb"><span class="vv">${d.tot?pctTxt(d.hech,d.tot):""}</span><span class="vt"><i class="${d.tot&&d.hech/d.tot<.7?"low":""}" style="height:${d.tot?Math.max(3,d.hech/d.tot*100):0}%"></i></span><span class="vl">${d.label}</span></div>`).join("")}</div></section>`;
  const mot=Object.entries(c.M).sort((a,b)=>b[1]-a[1]);const mMax=Math.max(1,...mot.map(m=>m[1]));
  const motivos=mot.length?`<section class="stack"><h2>Por qué no se hicieron</h2>${mot.map(([m,n])=>barra(m,n,mMax,n,"warnb")).join("")}</section>`:"";
  const top=Object.entries(c.T).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const topT=top.length?`<section class="stack"><h2>Tareas que más quedan sin hacer</h2><ol class="lst">${top.map(([t,n])=>`<li>${esc(t)} <b>· ${n} ${n===1?"vez":"veces"}</b></li>`).join("")}</ol></section>`:"";
  const obl=c.oblNo.length?`<section class="stack"><h2 class="red">Obligatorias sin hacer</h2><ul class="lst">${c.oblNo.map(o=>`<li><b>${esc(o.fecha)} · ${esc(o.quien)}</b>: ${esc(o.texto)} → ${esc(o.motivo)}${o.com?` (${esc(o.com)})`:""}</li>`).join("")}</ul></section>`:"";
  const falt=c.faltan.length?`<section class="stack"><h2 class="red">Turnos sin registro en la app</h2><ul class="lst">${c.faltan.map(x=>`<li><b>${DIAS[x.t.dia]} ${f(x.d)}</b> · ${esc(x.t.persona)} (${esc(x.t.nombre)} ${esc(x.t.horario)})</li>`).join("")}</ul></section>`:"";
  const rap=c.rapidos.length?`<section class="stack"><h2>Tildes de golpe</h2><p class="muted small" style="margin:0">Turnos donde se marcaron 8 o más tareas en menos de 3 minutos. Conviene chequear que se hayan hecho.</p><ul class="lst">${c.rapidos.map(r=>`<li><b>${esc(r.fecha)} · ${esc(r.quien)}</b> (${esc(r.turno)}): ${r.n} tareas casi al mismo tiempo</li>`).join("")}</ul></section>`:"";
  const prov=c.prov.length?`<section class="stack"><h2>Proveedores y pagos</h2><ul class="lst">${c.prov.map(p=>`<li><b>${esc(p.fecha)} · ${esc(p.quien)}</b>: ${esc(p.dato)}</li>`).join("")}</ul></section>`:"";
  return `${nav}<div class="report">${head}${kpi}${obl}${falt}${porPersona}${porDia}${motivos}${topT}${rap}${prov}</div>`;
}
function semanaTexto(){
  const c=calcSemana();const f=d=>`${d.getDate()}/${d.getMonth()+1}`;
  let s=`📊 *Resumen semanal Kiosco Brandsen*\nSemana del ${f(c.lun)} al ${f(c.dom)}\n\nTareas hechas: ${c.pct}% (${c.hech}/${c.tot})\nTurnos registrados: ${c.regs.length}\nObligatorias sin hacer: ${c.oblNo.length}\nTurnos sin usar la app: ${c.faltan.length}`;
  const pers=Object.entries(c.P).sort((a,b)=>b[1].hech/b[1].tot-a[1].hech/a[1].tot);
  if(pers.length){s+=`\n\n👥 *Por persona*`;pers.forEach(([q,p])=>{s+=`\n• ${q}: ${pctTxt(p.hech,p.tot)} (${p.hech}/${p.tot}) · ${p.turnos} turnos${p.obl?` · ⚠️ ${p.obl} obligatorias sin hacer`:""}`})}
  if(c.oblNo.length){s+=`\n\n⚠️ *Obligatorias sin hacer*`;c.oblNo.forEach(o=>{s+=`\n• ${o.fecha} ${o.quien}: ${o.texto} → ${o.motivo}`})}
  if(c.faltan.length){s+=`\n\n🚫 *Turnos sin registro*`;c.faltan.forEach(x=>{s+=`\n• ${DIAS[x.t.dia]} ${f(x.d)}: ${x.t.persona}`})}
  const mot=Object.entries(c.M).sort((a,b)=>b[1]-a[1]);if(mot.length){s+=`\n\n❓ *Motivos*`;mot.forEach(([m,n])=>{s+=`\n• ${m}: ${n}`})}
  return s;
}

async function _unused(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("kb:"+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}

async function guardarTurno(t){
  S.busy=true;
  try{await rpc("guardar_turno",{p_codigo:S.code,p_id:t.id,p_bloques:t.bloques||[],p_tareas:t.tareas||[]});
    S.busy=false;const i=S.turnos.findIndex(x=>x.id===t.id);if(i>=0)S.turnos[i]=t;render();return true}
  catch(e){S.busy=false;if(/codigo_incorrecto/.test(e.msg)){S.admin=false;S.view="adminLogin";S.loginErr="El código cambió. Ingresalo de nuevo.";render()}else toast("No se pudo guardar. Probá de nuevo.");return false}
}

      for(const r of vivos)await archivarYVaciar(r.id,r.turno_id,f,r.data,"admin");
      if(S.reg&&S.reg.fecha===f){S.reg.items={};S.reg.cerrado=false;S.reg.cerradoHora=""}
      S.motOpen=new Set();S.vaciarOk=false;S.busy=false;render();toast(vivos.length?`Listo: ${vivos.length} ${vivos.length===1?"lista vaciada":"listas vaciadas"}`:"No había listas tildadas hoy")}
    catch(e){S.busy=false;S.vaciarOk=false;render();toast("No se pudo vaciar. Revisá la conexión.")}}
  else if(a==="reset"){S.resetOk=true;render()}
  else if(a==="resetNo"){S.resetOk=false;render()}
  else if(a==="resetSi"){S.busy=true;render();
    try{clearTimeout(saveT);dirty=false;const t=turno(S.turnoId);
      flushSnapshot();const limpio=await archivarYVaciar(S.reg.id,S.reg.turnoId,S.reg.fecha,S.reg,S.reg.persona||t?.persona||"");
      S.reg=Object.assign(S.reg,limpio);S.motOpen=new Set();toast("Lista vacía. Lo anterior quedó en el historial.")}
    catch(e){toast("No se pudo vaciar. Revisá la conexión.")}
    S.busy=false;S.resetOk=false;render()}
  else if(a==="semPrev"){S.semOff=(S.semOff||0)-1;cargarSemana()}
  else if(a==="semNext"){S.semOff=Math.min(0,(S.semOff||0)+1);cargarSemana()}
  else if(a==="semPdf"){window.print()}
  else if(a==="semCopiar"){const txt=semanaTexto();try{await navigator.clipboard.writeText(txt);toast("Resumen semanal copiado")}catch(_){toast("No se pudo copiar")}}
  else if(a==="histHoy"){S.histFecha="";cargarHist()}
  else if(a==="hist"){S.histOpen=S.histOpen===id?null:id;render()}
});

$app.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset.quien){S.reg.persona=el.value.trim();saveReg()}
  else if(el.dataset.dato){item(el.dataset.dato).dato=el.value;saveReg()}
  else if(el.dataset.coment){item(el.dataset.coment).comentario=el.value;saveReg()}
});
$app.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.motivo){item(el.dataset.motivo).motivo=el.value;saveReg();render()}
  else if(el.id==="histFecha"){S.histFecha=el.value;cargarHist()}
  else if(el.id==="aSel"){S.aTurno=el.value;S.aConfirm=null;render()}
  else if(el.id==="nBloque"){S.aBloqueNuevo=el.value==="__nuevo";document.getElementById("nbWrap").hidden=!S.aBloqueNuevo}
  else if(el.id==="nCampo"){const txt=document.getElementById("nTxt").value;S.aCampo=el.value;render();document.getElementById("nTxt").value=txt}
});
$app.addEventListener("submit",async e=>{
  e.preventDefault();const f=e.target;
  if(f.id==="loginF"){const v=document.getElementById("codeIn").value.trim();if(!v)return;
    try{const ok=await rpc("verificar_codigo",{p_codigo:v});
      if(ok===true){S.code=v;S.admin=true;S.view="admin";S.aTab="tareas";S.aTurno=S.aTurno||turnosDelDia(1)[0]?.id||S.turnos[0]?.id;render()}
      else{S.loginErr="Código incorrecto.";render()}}
    catch(_){S.loginErr="No se pudo verificar el código. Revisá la conexión.";render()}}
  else if(f.id==="addF"){
    const texto=document.getElementById("nTxt").value.trim();if(!texto){toast("Escribí la tarea.");return}
    const t=clone(turno(S.aTurno));t.tareas=t.tareas||[];t.bloques=t.bloques||[];
    let bloque=document.getElementById("nBloque").value;
    if(bloque==="__nuevo"||!bloque){bloque=(document.getElementById("nBloqueNom")?.value||"").trim();if(!bloque){toast("Poné el nombre del bloque.");return}}
    if(!t.bloques.includes(bloque))t.bloques.push(bloque);
    const nt={id:uid(),texto,bloque,foto:document.getElementById("nFoto").checked,obligatoria:document.getElementById("nOblig").checked};
    const ct=document.getElementById("nCampo").value;
    if(ct!=="ninguno"){const label=(document.getElementById("nCampoLbl")?.value||"").trim();if(!label){toast("Escribí la pregunta del dato.");return}
      nt.campo={tipo:ct,label};if(ct==="opciones"){nt.campo.opciones=(document.getElementById("nOpts").value||"").split(",").map(s=>s.trim()).filter(Boolean);if(nt.campo.opciones.length<2){toast("Poné al menos 2 opciones.");return}}}
    const idx=t.tareas.map(x=>x.bloque).lastIndexOf(bloque);
    if(idx>=0)t.tareas.splice(idx+1,0,nt);else t.tareas.push(nt);
    S.aBloqueNuevo=false;S.aCampo="ninguno";
    if(await guardarTurno(t)){toast("Tarea agregada");}}
  else if(f.id==="codeF"){const a=document.getElementById("nc1").value.trim(),b=document.getElementById("nc2").value.trim();
    if(!/^\d{4,}$/.test(a)){toast("El código tiene que tener al menos 4 números.");return}
    if(a!==b){toast("Los códigos no coinciden.");return}
    try{await rpc("cambiar_codigo",{p_actual:S.code,p_nuevo:a});S.code=a;toast("Código actualizado");f.reset()}catch(_){toast("No se pudo guardar el código.")}}
});

/* ---------- inicio ---------- */
(function(){const d=diaOp(0);document.getElementById("hdate").textContent=`${DIAS[d.getDay()]} ${d.getDate()}/${d.getMonth()+1}`})();
render();
let cargando=false;
async function cargarTurnos(primera){
  if(cargando)return;cargando=true;
  const timer=primera?setTimeout(()=>{if(!S.loaded){S.loadNote="La lista está tardando en cargar. Revisá la conexión a internet.";render()}},10000):null;
  try{const rows=await api("turnos?select=*");
    S.turnos=rows.map(r=>({id:r.id,dia:r.dia,persona:r.persona,nombre:r.nombre,horario:r.horario,formato:r.formato,inicio:r.inicio,bloques:r.bloques||[],tareas:r.tareas||[]}));
    S.loaded=true;S.loadNote="";
    const typing=document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if(S.view==="home"||(!typing&&S.view!=="admin"))render();}
  catch(e){S.loaded=true;if(primera){S.loadNote="No se pudo cargar la lista de turnos. Revisá la conexión a internet.";render()}}
  if(timer)clearTimeout(timer);cargando=false;
}
cargarTurnos(true);
setInterval(()=>{if(document.visibilityState==="visible")cargarTurnos(false)},120000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")cargarTurnos(false)});
</script>
